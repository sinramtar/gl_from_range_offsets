# Workflow configuration. Relative directory entries are interpreted from
# Directories.work_dir, which is itself resolved from the directory Snakemake is
# launched in (the repository root).

Directories:
  work_dir:                   ..
  data_dir:                   data
  save_dir:                   results
  processing_dir:             inversion_outputs
  velocity:                   data/antarctica_iv_200m_s1_all_v20210908_vxyz.tif
  velocity_mag:               data/antarctica_iv_200m_s1_all_v20210908_mag.tif
  cats:                       data/CATS/CATS2008_v2023
  airpressure:                air_pressure
  basemap:                    data/basemap
  radar_mosaic:               data/RADARSAT_Mosaic.jp2
  slc:                        data/LarsenC/slc
  original_tmoc_gl:           tmoc_gl_2020.geojson
  # Per-scene DInSAR delineations, S1 and CSK together in one directory.
  dinsar_gls_automatic:       all_dinsar
  dinsar_uncertainty:         dinsar_uncertainty
  expt:                       bedmap_weighted
  flowline_variant:           hybrid_corrected

Offset_params:
  roi:                        LarsenC
  correlation_threshold:      0.1
  year:                       2020
  temporal_baseline:          6
  relative_orbit:             38
  flowline_spacing:           500
  range_pixel_spacing:        2.33

Flowline_params:
  landward:                   2.0e+4
  seaward:                    2.0e+4
  # Lines are traced at integration_step and resampled to step (both in m).
  integration_step:           50
  step:                       2
  progress_window_steps:      50
  min_progress_fraction:      0.5
  max_reversal_fraction:      0.0
  # Gaussian smoothing (pixels) and thresholds (m) of the range-offset standard deviation
  # that delimit the bending zone of the hybrid gradient field.
  sigma:                      4
  lower_stddev:               0.5
  upper_stddev:               1.1

Plot_params:
  Nplot:                      100

CEBU_params:
  N:                          4.0e+3
  # Final-level sample size as a multiple of N.
  Nlast:                      3
  max_steps:                  100
  tarCoV:                     0.5
  k_init:                     4
  method:                     GM
  quantiles:                  [0, 0.05, 0.1, 0.25, 0.5, 0.75, 0.90, 0.95, 1]
  seed:                       0

# Retained-pair filters and postprocessing parallelism.
Posterior_params:
  nESS:                       0.7
  tide:                       0.3
  workers:                    8

Prior:
  E:
    bounds:                   [0.6, 9]
    arg:                      [0.6, 9]
    dist:                     uniform
    type:                     PAR
  h:
    bounds:                   [10, 1000]
    arg:                      data/bedmap3.parquet
    dist:                     empirical
    type:                     DATA
    weights:                  true
  tides:
    bounds:                   [-3, 3]
    arg:                      [-3, 3]
    dist:                     uniform
    type:                     PAR
  gl:
    bounds:                   [15000, 25000]
    arg:                      [15000, 25000]
    dist:                     uniform
    type:                     PAR

# Range-offset errors. `raster` (per-pair error raster) and `correlation_coeffs`
# (per-pair offset-tracking correlation coefficients) are relative to the ROI data
# directory; `path` is the error sample passed to the likelihood, relative to work_dir.
Data_error:
  raster:                     data_error.tif
  correlation_coeffs:         all_correlation_coeffs.tif
  correlation_threshold:      0.9
  path:                       data/LarsenC/error_sample.parquet

Calibration:
  coverage_threshold:         100.0
  identifiable_crossing_tolerance_m: 100.0
  manual_reference_sigma_m:          100.0
  max_reference_half_width_m:        5000.0

Covariates:
  correlation_coeff:
    path:                     all_correlation_coeffs.tif
    per_pair:                 true
  error:
    path:                     data_error.tif
    per_pair:                 true
  ice_thickness:
    path:                     bedmap3.tif
    band:                     1
  ice_thickness_uncertainty:
    path:                     bedmap3.tif
    band:                     2
  cats_diff_tide:
    paths:
      - differential_tides_2019.tif
      - differential_tides_2020.tif
      - differential_tides_2021.tif
    per_pair:                 true
    sample:                   endpoint

Likelihood:
  sample_step:                200
